
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View PDF | Meet Sokhulu</title>

    <meta name="description" content="View Sokhulu's vehicle information and brochure online.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #171717;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h2 {
            font-size: 20px;
        }

        .buttons a {
            display: inline-block;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            margin-left: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .home {
            background: white;
            color: black;
        }

        .download {
            background: #d71920;
            color: white;
        }

        .viewer {
            width: 100%;
            height: calc(100vh - 75px);
            background: #333;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media(max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .buttons a {
                margin: 4px;
            }

            .viewer {
                height: calc(100vh - 125px);
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Meet Sokhulu | Unleash Your Adventurous Spirit with the X-Rider!</h2>

    <div class="buttons">
        <a href="index.html" class="home">Home</a>
    </div>
</header>

<div class="viewer">
    <iframe
        src="pdf/Isuzu-X-Rider.pdf"
        title="Online PDF Viewer"
        width="100%"
        height="600px"
        style="border: none;">
    </iframe>
</div>


</body>
</html>
